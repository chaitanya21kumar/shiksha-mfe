[project]
name = "lms-ai-engine"
version = "0.1.0"
description = "Local-first, LMS-agnostic AI engine: turns documents and media into portable, interactive micro-learning (H5P / SCORM / xAPI)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# A SCORM package carries its own player, so these are shipped inside the wheel
# and read at emit time. Without this they are silently absent from a build and
# every generated package would be missing its JavaScript.
#
# The data is attached to `app.packaging.scorm`, which is a real package, rather
# than to `...scorm.assets`, which is a plain directory. Keying it on the
# directory also works — pyproject's `packages.find` defaults to namespaces=true,
# so PEP 420 discovers it without an __init__.py — but that would leave the wheel
# quietly depending on a default someone could reasonably tighten later.
[tool.setuptools.package-data]
"app.packaging.scorm" = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Branch coverage, not line coverage. Most of what this engine promises is about
# the path *not* taken — a question dropped for not being grounded, a warning
# raised where a format cannot express something, a fallback when the model
# returns nothing. Line coverage marks those `if`s as covered the moment the happy
# path runs through them, which is exactly the case where the guarantee is
# untested.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Currently 93%. The floor sits below that on purpose: a threshold pinned to the
# exact current number turns every unrelated change into a coverage failure, and
# people respond to that by lowering it rather than by writing tests. Low enough
# not to nag, high enough that a new module arriving untested trips it.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
