<!DOCTYPE html>
<html lang="{lang}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<link rel="stylesheet" href="scorm/player.css">
</head>
<body>
<h1>{title}</h1>
<div id="timer" hidden></div>
<!-- The clock itself is not a live region: announcing every tick would make a
     screen reader unusable. Threshold warnings are announced here instead. -->
<output id="timer-announce" class="sr-only" aria-live="polite"></output>
<div id="banner" hidden></div>
<div id="quiz"></div>
<button id="submit" type="button">Submit</button>
<div id="results" hidden></div>
<script type="application/json" id="assessment-data">{data}</script>
<script src="scorm/api.js"></script>
<script src="scorm/player.js"></script>
</body>
</html>
